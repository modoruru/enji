project:
  origin:
    repo: modoruru/enji
    branch: dev
    path: src/test/resources/test.yml
  name: test configuration
  description: test configuration
  auto_update: true
  tokens:
    - github

# variables to ask user before installation
variables:
  server_port:
    description: Server port to use.
    regex: ^([1-9][0-9]{0,3}|[1-5][0-9]{4}|6[0-4][0-9]{3}|65[0-4][0-9]{2}|655[0-2][0-9]|6553[0-5])$
    default: 25565
  resourcepack_port:
    description: resourcepack public port for hitori:resourcepack
    regex: ^([1-9][0-9]{0,3}|[1-5][0-9]{4}|6[0-4][0-9]{3}|65[0-4][0-9]{2}|655[0-2][0-9]|6553[0-5])$
    default: 25566
  resourcepack_public_ip:
    description: resourcepack public ip which will be used for sending pack to players

core:
  # paper, purpur
  type: paper
  minecraft_version: 1.21.11
  version: "%latest%"

plugins:
  CommandAPI:
    source:
      type: github # github (for downloading release), or direct (uri)
      repo: CommandAPI/CommandAPI
      tag: 11.1.0
      asset: CommandAPI-11.1.0-Paper.jar
      # or:
      # type: direct
      # uri: https://github.com/CommandAPI/CommandAPI/releases/download/11.1.0/CommandAPI-11.1.0-Paper.jar
    configs:
      - plugins/CommandAPI/config.yml

hitori:
  version: "%latest%"
  modules:
    hitori:ux:
      source: # same as plugin source
        type: github
        repo: modoruru/hitori-ux
        tag: 1.0
        asset: ux-1.0.jar
      configs:
        - plugins/hitori/hitori_ux/config.yml
    hitori:resourcepack:
      source: # same as plugin source
        type: github
        repo: modoruru/hitori-resourcepack
        tag: 1.0
        asset: resourcepack-1.0.jar
      configs:
        - plugins/hitori/hitori_resourcepack/config.yml